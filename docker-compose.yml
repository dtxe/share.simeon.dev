name: share

services:
  postgres:
    image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: prod
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER}
      DB_NAME: ${POSTGRES_DB}
      DB_PASSWORD_FILE: /run/secrets/postgres_password
      OTP_HASH_PEPPER_FILE: /run/secrets/otp_hash_pepper
      LLM_API_KEY_FILE: /run/secrets/llm_api_key
      SMTP_PASS_FILE: /run/secrets/smtp_pass
      S3_CREDENTIALS_FILE: /run/secrets/s3_credentials
    secrets:
      - postgres_password
      - otp_hash_pepper
      - llm_api_key
      - smtp_pass
      - s3_credentials
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: prod
    depends_on:
      - backend
    ports:
      - "8001:8001"

volumes:
  pgdata:
  uploads:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  otp_hash_pepper:
    file: ./secrets/otp_hash_pepper.txt
  llm_api_key:
    file: ./secrets/llm_api_key.txt
  smtp_pass:
    file: ./secrets/smtp_pass.txt
  s3_credentials:
    file: ./secrets/s3_credentials.json
