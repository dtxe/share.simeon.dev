name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
      - name: go vet
        working-directory: backend
        run: go vet ./...
      - name: go test -race
        working-directory: backend
        run: go test -race ./...
      - name: govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - name: pnpm install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: pnpm test
        working-directory: frontend
        run: pnpm test
      - name: pnpm audit
        working-directory: frontend
        run: pnpm audit --audit-level moderate

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dockerfile: docker/backend.Dockerfile
            target: prod
            image: share-backend:scan
          - dockerfile: docker/frontend.Dockerfile
            target: prod
            image: share-frontend:scan
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f ${{ matrix.dockerfile }} --target ${{ matrix.target }} -t ${{ matrix.image }} .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}
          severity: HIGH,CRITICAL
          exit-code: "1"
