services:
  backend:
    build:
      target: dev
    volumes:
      - ./backend:/app
      - uploads:/data/uploads
    ports:
      - "8081:8080"
    environment:
      - DEBUG=true
    command: ["air", "-c", ".air.toml"]

  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_DEV_SERVER=true

volumes:
  frontend_node_modules:
